name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22+ required: `node --test` only expands glob patterns from 21 on,
          # and the frontend test script passes "dist-test/**/*.test.js".
          node-version: 22

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Typecheck frontend
        run: |
          cd frontend
          npm run typecheck

      - name: Test frontend
        run: |
          cd frontend
          npm test

      # frontend/dist is gitignored, so it must be built before any Go step:
      # main.go embeds it with //go:embed all:frontend/dist and fails to
      # compile when the directory is missing.
      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        # -race catches the data races that the background sync poller can hit.
        run: go test -race ./...

  build:
    name: Build (${{ matrix.build_name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows/amd64'
            os: 'windows-latest'
            build_name: 'Mixko-Windows-x64'
            output_name: 'mixko-win.exe'
            artifact_path: 'build/bin/*'
            wails_flags: ''
          - platform: 'darwin/universal'
            os: 'macos-latest'
            build_name: 'Mixko-macOS-Universal'
            output_name: 'mixko-mac'
            artifact_path: 'build/bin/*'
            wails_flags: ''
          - platform: 'linux/amd64'
            os: 'ubuntu-latest'
            build_name: 'Mixko-Linux-x64'
            output_name: 'mixko-linux'
            artifact_path: 'build/bin/*'
            wails_flags: '-tags webkit2_41'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22+ required: `node --test` only expands glob patterns from 21 on,
          # and the frontend test script passes "dist-test/**/*.test.js".
          node-version: 22

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build Wails App
        shell: bash
        run: |
          wails build -platform ${{ matrix.platform }} ${{ matrix.wails_flags }} -ldflags "-X mixko/services.AppVersion=${{ github.ref_name }}" -clean

      - name: Package and Rename Executable
        shell: bash
        run: |
          cd build/bin
          if [ "${{ runner.os }}" == "Windows" ]; then
            if [ -f "mixko.exe" ]; then mv mixko.exe mixko-win.exe; fi
          elif [ "${{ runner.os }}" == "macOS" ]; then
            if [ -d "mixko.app" ]; then
              zip -r mixko-mac.zip mixko.app
              rm -rf mixko.app
            elif [ -f "mixko" ]; then
              mv mixko mixko-mac
            fi
          elif [ "${{ runner.os }}" == "Linux" ]; then
            if [ -f "mixko" ]; then mv mixko mixko-linux; fi
          fi
          ls -la

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build_name }}
          path: ${{ matrix.artifact_path }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mixko-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

